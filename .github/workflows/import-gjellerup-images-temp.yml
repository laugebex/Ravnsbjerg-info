name: Import Gjellerup images temporary

on:
  push:
    branches:
      - image-batch-gjellerup-20260815
    paths:
      - .image-batch2/ready.json

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gjellerup
          for name in sti panorama udsigt; do
            cat .image-batch2/${name}-*.txt | tr -d '\n\r' | base64 -d > /tmp/gjellerup/${name}.webp
          done
          test "$(sha256sum /tmp/gjellerup/sti.webp | cut -d' ' -f1)" = "3f0c7417992660b58f5775a221e6804250968ad127b71b7303228975ab9fdb60"
          test "$(sha256sum /tmp/gjellerup/panorama.webp | cut -d' ' -f1)" = "61c6ebd16094eaf7a1817558da9ec6f15a2503d30dbbe2d699edb652757b351c"
          test "$(sha256sum /tmp/gjellerup/udsigt.webp | cut -d' ' -f1)" = "326d6cb0ec8feca6ea83ccd6c47f6b7fd15ec84ee49efc12950bf197289d2ede"
          file /tmp/gjellerup/*.webp
      - name: Commit photos to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/gjellerup/sti.webp public/images/gjellerup-enge-sti.webp
          cp /tmp/gjellerup/panorama.webp public/images/gjellerup-enge-panorama.webp
          cp /tmp/gjellerup/udsigt.webp public/images/gjellerup-enge-udsigt.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/gjellerup-enge-sti.webp public/images/gjellerup-enge-panorama.webp public/images/gjellerup-enge-udsigt.webp
          git commit -m "Fix Gjellerup Enge photos"
          git push origin HEAD:main
      - name: Remove upload branch
        if: success()
        shell: bash
        run: git push origin --delete "$GITHUB_REF_NAME" || true
