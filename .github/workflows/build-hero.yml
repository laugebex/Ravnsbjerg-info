name: Build hero image

on:
  push:
    branches: [photo-import-v2]
    paths:
      - '.github/workflows/build-hero.yml'

permissions:
  contents: write

jobs:
  build-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: photo-import-v2
      - name: Decode hero image
        run: |
          node <<'NODE'
          const fs = require('fs')
          const chunks = []
          for (let i = 0; i < 8; i++) {
            let text = fs.readFileSync(`data/localPhotos/hero${i}.js`, 'utf8').trim()
            text = text.replace(/^export default '/, '')
            text = text.replace(/';?$/, '')
            const base64 = text.replace(/[^A-Za-z0-9+/=]/g, '')
            if (!base64) throw new Error(`Could not read hero${i}.js`)
            chunks.push(base64)
          }
          const image = Buffer.from(chunks.join(''), 'base64')
          fs.mkdirSync('public/images', {recursive:true})
          fs.writeFileSync('public/images/hero-ravnsbjerg.avif', image)
          console.log(`Wrote ${image.length} bytes`)
          if (image.length < 50000) throw new Error(`Hero image is unexpectedly small: ${image.length} bytes`)
          NODE
      - name: Commit hero image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/hero-ravnsbjerg.avif
          git diff --cached --quiet && exit 0
          git commit -m "Add aerial hero image"
          git push origin HEAD:photo-import-v2
