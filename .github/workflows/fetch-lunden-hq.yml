name: Fetch Lunden HQ assets

on:
  push:
    paths:
      - '.github/workflows/fetch-lunden-hq.yml'

permissions:
  contents: write

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch full-resolution Lunden images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images
          curl --fail --location --retry 3 'https://398e19644f.clvaw-cdnwnd.com/924937a717deb337e31c66e81824097a/200000040-1549015492/df6156b8-e6cd-4fd6-a62d-a817fed3fcd0-1.webp?ph=398e19644f' -o public/images/lunden-2-hq.webp
          curl --fail --location --retry 3 'https://398e19644f.clvaw-cdnwnd.com/924937a717deb337e31c66e81824097a/200000041-1c7de1c7e0/ea6e5aa3-1b01-47d3-8fd4-1cae02db549f.webp?ph=398e19644f' -o public/images/lunden-1-hq.webp
          test -s public/images/lunden-2-hq.webp
          test -s public/images/lunden-1-hq.webp

      - name: Commit downloaded assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/lunden-1-hq.webp public/images/lunden-2-hq.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add full-resolution Lunden images'
          git push
